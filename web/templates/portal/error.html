{% extends "portal/base.html" %}
{% block title %}Error {{ error.code }}{% endblock %}
{% block content %}
<h1 class="page-title">Error {{ error.code }}<small>{{ error.name }}</small></h1>
<section class="panel">
  <p>{{ error.description }}</p>
  <p><a href="{{ url_for('dashboard') }}"><i class="bi bi-arrow-left" aria-hidden="true"></i> Back to dashboard</a></p>
</section>
{% endblock %}
